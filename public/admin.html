<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submissions — Method Machine Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --stage:#0a0a0c; --panel:#14151c; --panel-2:#1b1d26; --ink:#ece6dd; --ink-dim:#a7a49c; --ink-faint:#6f6b63;
    --copper:#c68a4e; --copper-hi:#e2b681; --blue:#6098de; --blue-hi:#a3c3ef;
    --line:rgba(236,230,221,.10); --line-copper:rgba(198,138,78,.28); --line-blue:rgba(96,152,222,.32);
    --f-disp:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0; background:var(--stage); color:var(--ink); font-family:var(--f-body); font-size:14.5px; line-height:1.55}
  h1,h2{margin:0; font-family:var(--f-disp); font-weight:500; letter-spacing:-.02em}
  p{margin:0}
  button,input{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint)}
  .wrap{max-width:1240px; margin-inline:auto; padding-inline:clamp(16px,3vw,32px)}
  .top{border-bottom:1px solid var(--line); background:rgba(10,10,12,.9); position:sticky; top:0; z-index:5; backdrop-filter:blur(12px)}
  .top .wrap{display:flex; align-items:center; gap:14px; min-height:62px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto}
  .brand svg{width:24px; height:24px}
  .brand b{font-family:var(--f-disp); font-weight:500}
  .btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:10px 16px; border-radius:9px; border:1px solid var(--line-blue); background:transparent; color:var(--ink); font-family:var(--f-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer}
  .btn:hover{background:rgba(96,152,222,.1)}
  .btn.go{background:var(--copper); border-color:var(--copper); color:var(--stage)}
  .btn.go:hover{background:var(--copper-hi)}
  input[type=password],input[type=search]{background:var(--stage); border:1px solid var(--line); border-radius:9px; min-height:44px; padding:10px 12px}
  input:focus{outline:none; border-color:var(--copper)}

  .gate{max-width:420px; margin:14vh auto 0; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:30px 26px}
  .gate h1{font-size:26px; margin-top:8px}
  .gate form{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap}
  .gate input{flex:1; min-width:180px}
  .err{color:var(--copper-hi); font-family:var(--f-mono); font-size:12px; margin-top:12px; min-height:1.2em}

  .tabs{display:flex; gap:4px; flex-wrap:wrap; margin:22px 0 0; border-bottom:1px solid var(--line)}
  .tabs button{background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; min-height:52px; padding:6px 14px; cursor:pointer; text-align:left; color:var(--ink-dim)}
  .tabs button b{display:block; font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:500}
  .tabs button span{font-size:12px; color:var(--ink-faint)}
  .tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--copper)}
  .tabs button .n{color:var(--copper-hi)}

  .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:18px 0}
  .bar input{flex:1; min-width:200px}
  .count{font-family:var(--f-mono); font-size:12px; color:var(--ink-dim)}

  .list{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel)}
  .item + .item{border-top:1px solid var(--line)}
  .item summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:150px minmax(0,1.3fr) minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 16px; min-height:52px}
  .item summary::-webkit-details-marker{display:none}
  .item summary:hover{background:var(--panel-2)}
  .item[open] summary{background:var(--panel-2); border-bottom:1px solid var(--line)}
  .when{font-family:var(--f-mono); font-size:12px; color:var(--ink-dim)}
  .who{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who small{display:block; color:var(--ink-dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis}
  .tag{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em; color:var(--blue-hi); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chev{color:var(--ink-faint); font-family:var(--f-mono)}
  .item[open] .chev{color:var(--copper)}
  .fields{display:grid; grid-template-columns:180px minmax(0,1fr); gap:8px 18px; padding:16px 18px 20px}
  .fields dt{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); padding-top:3px}
  .fields dd{margin:0; overflow-wrap:anywhere; white-space:pre-wrap}
  .fields pre{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--f-mono); font-size:12px; background:var(--stage); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:420px; overflow:auto}
  .empty{padding:40px 18px; text-align:center; color:var(--ink-dim)}
  .more{display:flex; justify-content:center; margin:16px 0 60px}

  @media (max-width:760px){
    .item summary{grid-template-columns:1fr auto; gap:4px 10px}
    .item summary .when{grid-column:1 / -1}
    .item summary .tag{grid-column:1}
    .fields{grid-template-columns:1fr}
  }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#c68a4e" stroke-width="1.4"/><path d="M11 27V14l5 8 4-8 4 8 5-8v13" fill="none" stroke="#c68a4e" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg><b>Submissions</b></div>
    <button class="btn" id="refresh" type="button" hidden>Refresh</button>
    <button class="btn" id="signout" type="button" hidden>Sign out</button>
  </div>
</header>

<main class="wrap">
  <section class="gate" id="gate">
    <span class="lbl">Method Machine Studio · owner only</span>
    <h1>Sign in to view submissions</h1>
    <form id="login">
      <input type="password" id="pw" autocomplete="current-password" aria-label="Admin password" placeholder="Admin password" required>
      <button class="btn go" type="submit">Open</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
  </section>

  <section id="app" hidden>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="bar">
      <input type="search" id="q" placeholder="Filter by name, email, track, anything" aria-label="Filter submissions">
      <span class="count" id="count"></span>
      <button class="btn" id="csv" type="button">Download CSV</button>
    </div>
    <div class="list" id="list"></div>
    <div class="more"><button class="btn" id="more" type="button" hidden>Load older</button></div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var KEY="mms_admin", token="", tables={}, current="", rows=[], total=0, cols=[];
  try{ token=sessionStorage.getItem(KEY)||""; }catch(e){}

  /* row headline per table: [who, detail, tag] */
  var HEAD={
    waitlist:function(r){return [r.email, r.page||"", ""]},
    applications:function(r){return [r.name||"(no name)", r.email, [r.candidate, r.aptitude_auto&&("aptitude "+r.aptitude_auto), r.hard_fails&&r.hard_fails!=="0"&&("hard fails "+r.hard_fails)].filter(Boolean).join(" · ")]},
    institute_papers:function(r){return [r.name||"(no name)", r.email, [r.roll, r.track, r.years].filter(Boolean).join(" · ")]},
    members:function(r){return [r.email||r.customer_id, r.subscription_id, [r.plan, r.interval, r.status].filter(Boolean).join(" · ")]},
    uploads:function(r){return [r.name||r.r2_key, r.slot||"", r.size?Math.round(r.size/1024)+" KB":""]}
  };

  function h(tag, attrs, kids){
    var el=document.createElement(tag);
    for(var k in (attrs||{})){ var v=attrs[k]; if(v==null||v===false) continue;
      if(k==="text") el.textContent=v; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?"":v); }
    (kids||[]).forEach(function(c){ if(c!=null) el.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return el;
  }
  function when(s){ if(!s) return "—"; var d=new Date(s); return isNaN(d)?s:d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

  function api(path){
    return fetch(path,{headers:{Authorization:"Bearer "+token,Accept:"application/json"},cache:"no-store"}).then(function(r){
      return r.json().catch(function(){return {ok:false}}).then(function(j){ j._status=r.status; return j; });
    });
  }
  function signedOut(msg){
    token=""; try{ sessionStorage.removeItem(KEY); }catch(e){}
    $("app").hidden=true; $("gate").hidden=false; $("refresh").hidden=true; $("signout").hidden=true;
    $("loginErr").textContent=msg||""; $("pw").value=""; $("pw").focus();
  }
  function explain(j){
    if(j._status===401) return "That password isn't right.";
    if(j._status===429) return "Too many wrong attempts. Wait ten minutes and try again.";
    if(j.error==="admin_not_configured") return "The ADMIN_PASSWORD secret isn't set on the Worker yet.";
    return "Couldn't load submissions. Try again.";
  }

  function loadSummary(){
    return api("/api/admin/summary").then(function(j){
      if(!j.ok){ signedOut(explain(j)); return false; }
      tables=j.tables;
      $("gate").hidden=true; $("app").hidden=false; $("refresh").hidden=false; $("signout").hidden=false;
      if(!current){ current=Object.keys(tables).filter(function(k){return tables[k].count>0})[0]||"waitlist"; }
      renderTabs(); return true;
    }).catch(function(){ signedOut("We couldn't reach the server."); return false; });
  }
  function renderTabs(){
    var t=$("tabs"); t.textContent="";
    Object.keys(tables).forEach(function(k){
      var s=tables[k];
      t.appendChild(h("button",{type:"button",role:"tab","aria-selected":k===current?"true":"false",onclick:function(){ current=k; renderTabs(); loadRows(false); }},[
        h("b",{},[s.label+" ",h("span",{class:"n",text:String(s.count)})]),
        h("span",{text:s.last?"Latest "+when(s.last):"None yet"})
      ]));
    });
  }
  function loadRows(more){
    var off=more?rows.length:0;
    if(!more){ rows=[]; $("list").textContent=""; $("list").appendChild(h("p",{class:"empty",text:"Loading…"})); }
    return api("/api/admin/rows?table="+encodeURIComponent(current)+"&limit=500&offset="+off).then(function(j){
      if(!j.ok){ if(j._status===401||j._status===429) signedOut(explain(j)); return; }
      cols=j.cols; total=j.total; rows=more?rows.concat(j.rows):j.rows; renderRows();
    });
  }
  function matches(r,q){ if(!q) return true; q=q.toLowerCase(); return cols.some(function(c){ return r[c]!=null && String(r[c]).toLowerCase().indexOf(q)>=0; }); }
  function pretty(v){
    if(typeof v!=="string") return null;
    var s=v.trim(); if(!(s[0]==="{"||s[0]==="[")) return null;
    try{ return JSON.stringify(JSON.parse(s),null,2); }catch(e){ return null; }
  }
  function renderRows(){
    var list=$("list"); list.textContent="";
    var q=$("q").value.trim(), shown=rows.filter(function(r){return matches(r,q)});
    $("count").textContent=shown.length+" shown · "+total+" total";
    $("more").hidden=rows.length>=total;
    if(!shown.length){ list.appendChild(h("p",{class:"empty",text:rows.length?"Nothing matches that filter.":"No submissions yet."})); return; }
    var head=HEAD[current]||function(){return ["","",""]};
    var time=cols[1];
    shown.forEach(function(r){
      var hd=head(r);
      var d=h("details",{class:"item"},[h("summary",{},[
        h("span",{class:"when",text:when(r[time])}),
        h("span",{class:"who"},[hd[0]||"—",hd[1]?h("small",{text:hd[1]}):null]),
        h("span",{class:"tag",text:hd[2]||""}),
        h("span",{class:"chev","aria-hidden":"true",text:"+"})
      ])]);
      d.addEventListener("toggle",function(){
        if(!d.open||d.querySelector(".fields")) return;
        var dl=h("dl",{class:"fields"});
        cols.forEach(function(c){
          var v=r[c]; if(v==null||v==="") return;
          var p=pretty(v), long=typeof v==="string"&&v.length>240;
          dl.appendChild(h("dt",{text:c.replace(/_/g," ")}));
          dl.appendChild(h("dd",{},[p||long?h("pre",{text:p||v}):String(v)]));
        });
        d.appendChild(dl);
      });
      list.appendChild(d);
    });
  }
  function csv(){
    var q=$("q").value.trim(), shown=rows.filter(function(r){return matches(r,q)});
    var esc=function(v){ v=v==null?"":String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    var out=[cols.join(",")].concat(shown.map(function(r){return cols.map(function(c){return esc(r[c])}).join(",")})).join("\r\n");
    var a=h("a",{href:URL.createObjectURL(new Blob(["﻿"+out],{type:"text/csv"})),download:current+"-"+new Date().toISOString().slice(0,10)+".csv"});
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }

  $("login").addEventListener("submit",function(e){
    e.preventDefault(); token=$("pw").value; $("loginErr").textContent="";
    loadSummary().then(function(ok){ if(ok){ try{ sessionStorage.setItem(KEY,token); }catch(e){} loadRows(false); } });
  });
  $("q").addEventListener("input",renderRows);
  $("csv").addEventListener("click",csv);
  $("more").addEventListener("click",function(){ loadRows(true); });
  $("refresh").addEventListener("click",function(){ loadSummary().then(function(ok){ if(ok) loadRows(false); }); });
  $("signout").addEventListener("click",function(){ signedOut(""); });

  if(token) loadSummary().then(function(ok){ if(ok) loadRows(false); }); else $("pw").focus();
})();
</script>
</html>
